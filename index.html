<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Public sound-design portfolio for Nguyen Ngoc Hieu.">
  <title>Nguyen Ngoc Hieu - Sound Designer</title>
  <style>
    :root{--ink:#37353E;--slate:#44444E;--taupe:#715A5A;--mist:#D3DAD9;--paper:#fafafa}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px "Segoe UI",Arial,sans-serif;line-height:1.55}
    .wrap{width:min(1120px,calc(100% - 32px));margin:auto}.bar{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--mist)}
    a{color:inherit}.lang{border:1px solid var(--ink);background:#fff;padding:8px 12px;cursor:pointer;font:inherit}.hero{padding:80px 0 48px;display:grid;grid-template-columns:1.3fr .7fr;gap:32px}
    .eyebrow{font-size:.78rem;letter-spacing:.12em;font-weight:700;color:var(--taupe)}h1{font-size:clamp(3rem,8vw,6.4rem);line-height:.9;margin:12px 0 24px;letter-spacing:-.06em}
    h2{font-size:clamp(2rem,5vw,3.5rem);line-height:1;margin:0 0 16px}.panel{background:var(--ink);color:#fff;padding:28px}.section{padding:48px 0;border-top:1px solid var(--mist)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--mist);padding:18px;background:#fff}.card h3{margin:0 0 8px}.card p,.note{margin:0;color:#555}
    .media{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.media video,.card audio,#guide{width:100%;display:block;margin-top:14px;background:#111}.contact{background:var(--taupe);color:#fff;padding:32px}.contact a{color:#fff}.contact ul{padding-left:18px}
    @media(max-width:760px){.hero,.grid,.media{grid-template-columns:1fr}.hero{padding-top:48px}}
  </style>
</head>
<body>
  <header class="wrap bar"><strong id="brand">NGUYEN NGOC HIEU / AUDIO</strong><button id="lang" class="lang" type="button" aria-label="Switch language">VI</button></header>
  <main class="wrap">
    <section class="hero"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="intro"></p></div><aside class="panel"><p class="eyebrow">ROLE</p><h3 id="role"></h3><p id="rolecopy"></p></aside></section>
    <section class="section"><h2 id="caseTitle"></h2><div class="grid" id="cases"></div></section>
    <section class="section"><h2 id="audioTitle"></h2><p class="note" id="audioIntro"></p><div class="grid" id="audio"></div></section>
    <section class="section"><h2 id="guideTitle"></h2><p class="note" id="guideIntro"></p><video id="guide" controls preload="metadata" src="video/listening-guide.mp4"></video></section>
    <section class="section"><h2 id="visualTitle"></h2><p class="note" id="visualIntro"></p><div class="media" id="visual"></div></section>
    <section class="section contact"><h2 id="contactTitle"></h2><p id="contactIntro"></p><ul><li><a href="mailto:hieuzzai9@gmail.com">Email</a></li><li><a href="https://www.linkedin.com/in/hyeur/">LinkedIn</a></li><li><a href="https://soundcloud.com/hyeurxx/tracks">SoundCloud</a></li></ul></section>
  </main>
  <script>
    const D={
      en:{brand:'NGUYEN NGOC HIEU / AUDIO',eyebrow:'PUBLIC PORTFOLIO',title:'Sound, with purpose.',intro:'Nguyen Ngoc Hieu is a Sound Designer / Technical Sound Designer focused on expressive game audio, Unreal Engine implementation, and practical audio workflow.',role:'Sound Designer / Technical Sound Designer',rolecopy:'Creative sound design, implementation, mixing, debugging, and collaboration.',caseTitle:'Selected practice',cases:[['Gameplay feedback','Layered action feedback designed for clarity, timing, and variation.'],['World audio','Atmosphere, spatial detail, and mix relationships for interactive spaces.'],['Audio tooling','Repeatable authoring, routing, debugging, and review workflows.']],audioTitle:'Audio reel',audioIntro:'Eight approved sound-design samples. Select a clip to listen.',guideTitle:'Abstract listening guide',guideIntro:'A visual companion built from abstract geometry. It is not gameplay footage.',visualTitle:'Censored visual studies',visualIntro:'Three approved censored excerpts with cleared audio. They provide context only and do not identify a project.',contactTitle:'Let\'s make sound matter.',contactIntro:'Available for sound design and technical-audio opportunities.',audios:['Combat feedback','Interaction detail','World ambience','System texture','Heavy impact','Energy texture','Movement detail','Cinematic transition'],visuals:['Attack timing','Teleport transition','Encounter intensity']},
      vi:{brand:'NGUY\u1ec4N NG\u1eccC HI\u1ebeU / AUDIO',eyebrow:'H\u1ed2 S\u01a0 C\u00d4NG KHAI',title:'\u00c2m thanh, c\u00f3 ch\u1ee7 \u0111\u00edch.',intro:'Nguy\u1ec5n Ng\u1ecdc Hi\u1ebfu l\u00e0 Sound Designer / Technical Sound Designer, t\u1eadp trung v\u00e0o \u00e2m thanh game gi\u00e0u bi\u1ec3u c\u1ea3m, tri\u1ec3n khai Unreal Engine v\u00e0 quy tr\u00ecnh audio th\u1ef1c ti\u1ec5n.',role:'Sound Designer / Technical Sound Designer',rolecopy:'Thi\u1ebft k\u1ebf \u00e2m thanh s\u00e1ng t\u1ea1o, tri\u1ec3n khai, tr\u1ed9n \u00e2m, g\u1ee1 l\u1ed7i v\u00e0 ph\u1ed1i h\u1ee3p.',caseTitle:'N\u0103ng l\u1ef1c ti\u00eau bi\u1ec3u',cases:[['Ph\u1ea3n h\u1ed3i l\u1ed1i ch\u01a1i','Thi\u1ebft k\u1ebf ph\u1ea3n h\u1ed3i h\u00e0nh \u0111\u1ed9ng nhi\u1ec1u l\u1edbp, ch\u00fa tr\u1ecdng \u0111\u1ed9 r\u00f5, th\u1eddi \u0111i\u1ec3m v\u00e0 bi\u1ebfn th\u1ec3.'],['\u00c2m thanh th\u1ebf gi\u1edbi','B\u1ea7u kh\u00f4ng kh\u00ed, chi ti\u1ebft kh\u00f4ng gian v\u00e0 quan h\u1ec7 tr\u1ed9n \u00e2m cho m\u00f4i tr\u01b0\u1eddng t\u01b0\u01a1ng t\u00e1c.'],['C\u00f4ng c\u1ee5 audio','Quy tr\u00ecnh authoring, routing, g\u1ee1 l\u1ed7i v\u00e0 review c\u00f3 th\u1ec3 l\u1eb7p l\u1ea1i.']],audioTitle:'Audio reel',audioIntro:'T\u00e1m m\u1eabu thi\u1ebft k\u1ebf \u00e2m thanh \u0111\u00e3 \u0111\u01b0\u1ee3c ph\u00ea duy\u1ec7t. Ch\u1ecdn m\u1ed9t m\u1eabu \u0111\u1ec3 nghe.',guideTitle:'H\u01b0\u1edbng d\u1eabn l\u1eafng nghe tr\u1eebu t\u01b0\u1ee3ng',guideIntro:'Ph\u1ea7n h\u00ecnh \u1ea3nh \u0111\u1ed3ng h\u00e0nh \u0111\u01b0\u1ee3c t\u1ea1o b\u1eb1ng \u0111\u1ed3 h\u1ecda tr\u1eebu t\u01b0\u1ee3ng, kh\u00f4ng ph\u1ea3i c\u1ea3nh quay l\u1ed1i ch\u01a1i.',visualTitle:'Nghi\u00ean c\u1ee9u h\u00ecnh \u1ea3nh \u0111\u00e3 ki\u1ec3m duy\u1ec7t',visualIntro:'Ba tr\u00edch \u0111o\u1ea1n \u0111\u00e3 ki\u1ec3m duy\u1ec7t, c\u00f3 \u00e2m thanh \u0111\u01b0\u1ee3c ph\u00e9p c\u00f4ng khai. Ch\u00fang ch\u1ec9 cung c\u1ea5p ng\u1eef c\u1ea3nh v\u00e0 kh\u00f4ng x\u00e1c \u0111\u1ecbnh d\u1ef1 \u00e1n.',contactTitle:'H\u00e3y \u0111\u1ec3 \u00e2m thanh c\u00f3 \u00fd ngh\u0129a.',contactIntro:'S\u1eb5n s\u00e0ng cho c\u00e1c c\u01a1 h\u1ed9i Sound Design v\u00e0 Technical Audio.',audios:['Ph\u1ea3n h\u1ed3i chi\u1ebfn \u0111\u1ea5u','Chi ti\u1ebft t\u01b0\u01a1ng t\u00e1c','Kh\u00f4ng gian th\u1ebf gi\u1edbi','Ch\u1ea5t li\u1ec7u h\u1ec7 th\u1ed1ng','T\u00e1c \u0111\u1ed9ng m\u1ea1nh','Ch\u1ea5t li\u1ec7u n\u0103ng l\u01b0\u1ee3ng','Chi ti\u1ebft chuy\u1ec3n \u0111\u1ed9ng','Chuy\u1ec3n c\u1ea3nh \u0111i\u1ec7n \u1ea3nh'],visuals:['Nh\u1ecbp \u0111\u1ed9 t\u1ea5n c\u00f4ng','Chuy\u1ec3n ti\u1ebfp d\u1ecbch chuy\u1ec3n','C\u01b0\u1eddng \u0111\u1ed9 ch\u1ea1m tr\u00e1n']}
    };
    const ap=['combat-feedback.wav','interaction-ui.wav','world-ambience.wav','system-texture.wav','heavy-impact.wav','energy-texture.wav','movement-detail.wav','cinematic-transition.wav'];
    const vp=['attack-study.mp4','teleport-study.mp4','encounter-study.mp4'];
    let lang=localStorage.getItem('portfolioLanguage')==='vi'?'vi':'en';
    function bindMedia(){const all=[...document.querySelectorAll('audio,video')];all.forEach(m=>m.addEventListener('play',()=>all.forEach(o=>{if(o!==m)o.pause()})))}
    function render(){const d=D[lang];document.documentElement.lang=lang;document.title='Nguyen Ngoc Hieu - Sound Designer';document.getElementById('brand').textContent=d.brand;['eyebrow','title','intro','role','rolecopy','caseTitle','audioTitle','audioIntro','guideTitle','guideIntro','visualTitle','visualIntro','contactTitle','contactIntro'].forEach(k=>document.getElementById(k).textContent=d[k]);document.getElementById('cases').innerHTML=d.cases.map(x=>`<article class="card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.getElementById('audio').innerHTML=d.audios.map((x,i)=>`<article class="card"><h3>${x}</h3><audio controls preload="metadata" src="audio/${ap[i]}"></audio></article>`).join('');document.getElementById('visual').innerHTML=d.visuals.map((x,i)=>`<article class="card"><h3>${x}</h3><video controls playsinline preload="metadata" src="video/featured/${vp[i]}"></video></article>`).join('');document.getElementById('lang').textContent=lang==='en'?'VI':'EN';document.getElementById('lang').setAttribute('aria-label',lang==='en'?'Switch to Vietnamese':'Chuy\u1ec3n sang ti\u1ebfng Anh');bindMedia()}
    document.getElementById('lang').onclick=()=>{lang=lang==='en'?'vi':'en';localStorage.setItem('portfolioLanguage',lang);render()};render();
  </script>
</body>
</html>
