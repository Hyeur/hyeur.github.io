name: Publish portfolio content
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-hosting-publish
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUNDDESIGNPORTFOLIO }}'
      - run: npm ci
      - run: npm ci --prefix admin
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Export published Firestore entries and release manifest
        run: npm run export:content
        env:
          FIREBASE_PROJECT_ID: sounddesignportfolio
          PUBLISH_MANIFEST_PATH: ${{ runner.temp }}/release-manifest.json
      - name: Build Hugo site
        run: npm run build:site
      - name: Build custom editor
        run: npm --prefix admin run build
      - name: Compare release with last successful deployment
        id: release
        run: node scripts/publisher-state.mjs check
        env:
          FIREBASE_PROJECT_ID: sounddesignportfolio
          PUBLISH_MANIFEST_PATH: ${{ runner.temp }}/release-manifest.json
      - name: Deploy Firebase Hosting
        id: deploy
        if: steps.release.outputs.changed == 'true'
        run: firebase deploy --only hosting --project sounddesignportfolio --non-interactive
      - name: Record successful deployment state
        if: success() && steps.deploy.outcome == 'success'
        run: node scripts/publisher-state.mjs record
        env:
          FIREBASE_PROJECT_ID: sounddesignportfolio
          PUBLISH_MANIFEST_PATH: ${{ runner.temp }}/release-manifest.json
